
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Component Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>PC Component Hub</h1>
        <p>Find the right parts for your next PC build!</p>
    </header>

    <main>
        <h2>Shop Computer Components</h2>

        <div class="search-section">
            <input type="text" id="searchInput"
                   placeholder="Search for PC components...">

            <select id="categoryFilter">
                <option value="all">All Categories</option>
                <option value="GPU">Graphics Cards</option>
                <option value="CPU">Processors</option>
                <option value="Motherboard">Motherboards</option>
                <option value="RAM">Memory (RAM)</option>
                <option value="Storage">Storage</option>
            </select>
        </div>

        <div id="productList"></div>
        <section id="cartSection">
    <h2>Shopping Cart</h2>
    <div id="cartItems">
        <p>Your cart is empty.</p>
    </div>
    <h3 id="cartTotal">Total: $0.00</h3>
</section>
    </main>

    <footer>
        <p>PC Component Hub - Student Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
